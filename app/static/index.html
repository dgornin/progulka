<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прогулка — пеший маршрут из реальных мест</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c8412a'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&family=JetBrains+Mono:wght@400;500;600&family=Spectral:ital,wght@0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <svg class="logo" viewBox="0 0 44 44" aria-hidden="true">
      <path d="M7 35 C 13 18, 26 32, 30 17 S 36 8, 37 8" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 5.5"/>
      <circle class="logo-start" cx="7" cy="35" r="4.5"/>
      <circle cx="19" cy="25.5" r="3.5" fill="currentColor"/>
      <circle cx="37" cy="8" r="4.5" fill="currentColor"/>
    </svg>
    <div class="brand">
      <h1>Прогулка</h1>
      <p>агент собирает пеший маршрут из реальных мест: OpenStreetMap, Википедия, Wikivoyage</p>
    </div>
    <p class="health" id="health" data-state="pending">проверяю сервер…</p>
  </header>

  <main class="layout">
    <aside class="side">
      <form class="card composer" id="composer">
        <label class="composer-label" for="request">Опишите прогулку</label>
        <textarea id="request" name="request" rows="4" required minlength="3" maxlength="2000"
                  placeholder="Суббота в Петербурге, с 11 до 18. Люблю конструктивизм и стрит-арт, хочу попробовать местную уличную еду, музеи не надо. Старт от Московского вокзала."></textarea>
        <div class="examples">
          <span>Например:</span>
          <button type="button" class="example"
                  data-example="Суббота в Петербурге, с 11 до 18. Люблю конструктивизм и стрит-арт, хочу попробовать местную уличную еду, музеи не надо. Старт от Московского вокзала.">Петербург · конструктивизм</button>
          <button type="button" class="example"
                  data-example="Воскресенье в Москве с 10 до 16, гуляем с ребёнком 8 лет. Парки, что-нибудь про науку и где вкусно пообедать, без долгих переходов. Начнём от метро «Парк культуры».">Москва · с ребёнком</button>
          <button type="button" class="example"
                  data-example="Казань, один день с 12 до 20. Татарская кухня, мечети и старинные купеческие дома, а вечером — красивый вид на закат. Старт у Кремля.">Казань · кухня и закат</button>
        </div>
        <details class="refine">
          <summary>Уточнить</summary>
          <div class="refine-grid">
            <label>Город <input name="city" autocomplete="off" maxlength="100" placeholder="Санкт-Петербург"></label>
            <label>Дата <input name="date" type="date"></label>
            <label>Начало <input name="start_time" type="time"></label>
            <label>Конец <input name="end_time" type="time"></label>
            <label class="wide">Точка старта <input name="start_point" autocomplete="off" maxlength="200" placeholder="Московский вокзал"></label>
          </div>
        </details>
        <button class="primary" id="build" type="submit">Построить маршрут</button>
      </form>

      <section class="card trace" aria-labelledby="trace-title">
        <div class="trace-head">
          <h2 id="trace-title">Ход работы агента</h2>
          <ol class="steps" id="steps"></ol>
          <p class="status" id="status" aria-live="polite"></p>
          <button class="stop-run" id="stop" type="button" hidden>Остановить агента</button>
        </div>
        <p class="hint" id="trace-hint">Здесь будет видно, как агент работает: какие источники спрашивает,
          что находит, какие места берёт в маршрут и почему.</p>
        <ol class="trace-log" id="log"></ol>
      </section>
    </aside>

    <section class="map-wrap" aria-label="Карта маршрута">
      <div id="map"></div>
    </section>

    <section class="card plan-col" aria-label="Маршрут">
      <div class="plan" id="plan"></div>
      <form class="feedback" id="feedback" hidden>
        <p class="reply" id="reply" hidden></p>
        <label for="feedback-text">Что изменить?</label>
        <div class="feedback-row">
          <textarea id="feedback-text" name="feedback" rows="2" maxlength="1000"
                    placeholder="Например: добавь кофейню после обеда"></textarea>
          <button type="submit" class="primary">Перестроить</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
