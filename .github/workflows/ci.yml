name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests eval
      - run: ruff format --check app tests eval
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t progulka .
      # The image must start and answer /api/health with a dummy key (no LLM call is made).
      - run: |
          docker run -d --name progulka -p 8000:8000 \
            -e API_KEY=dummy -e MODEL_NAME=anthropic/claude-haiku-5.5 progulka
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health && exit 0; sleep 1; done
          docker logs progulka; exit 1
